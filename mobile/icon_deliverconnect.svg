  <path d="M220 380 A310 310 0 0 1 804 380" fill="none" stroke="#378ADD" stroke-width="8" stroke-linecap="round" opacity="0.3" style="fill:none;stroke:rgb(55, 138, 221);color:rgb(255, 255, 255);stroke-width:8px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.3;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

